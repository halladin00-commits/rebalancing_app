<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>리밸런싱 - 포트폴리오 자산배분 계산기</title>
<meta name="description" content="주식·ETF 리밸런싱 계산기. ISA·연금저축·미국주식 비중과 사고팔 수량, 수익률을 한 번에">
<!--
  블로그·커뮤니티에 붙이는 링크용 페이지.

  왜 있나 — 네이버 블로그에 Play 스토어 주소를 붙이면 링크 카드가 영어판
  이름으로 나왔다. Play는 hl=ko면 한국어를 주는데, 네이버가 처음 받아 둔
  미리보기를 계속 써서 고칠 길이 없었다(2026-11-20). 카드의 제목·설명·
  그림을 우리가 정하려고 이 페이지를 거친다.

  쓰는 법: https://halladin00-commits.github.io/rebalancing_app/app/?src=naverblog&c=howto
  src·c가 Play의 utm_source·utm_campaign으로 넘어가 설치 경로가 잡힌다.
-->
<meta property="og:type" content="website">
<meta property="og:site_name" content="Google Play">
<meta property="og:title" content="리밸런싱 - 포트폴리오 자산배분 계산기">
<meta property="og:description" content="주식·ETF 리밸런싱 계산기. ISA·연금저축·미국주식 비중과 사고팔 수량, 수익률을 한 번에">
<meta property="og:image" content="https://halladin00-commits.github.io/rebalancing_app/app/og.png">
<meta property="og:image:width" content="1024">
<meta property="og:image:height" content="500">
<meta property="og:locale" content="ko_KR">
<meta name="twitter:card" content="summary_large_image">
<style>
  :root { --ground: #0a3a35; --ink: #fbf8f1; --accent: #8fe7b0; }
  body {
    margin: 0; min-height: 100vh; display: grid; place-items: center;
    background: var(--ground); color: var(--ink);
    font: 500 16px/1.6 -apple-system, "Segoe UI", "Noto Sans KR", sans-serif;
    text-align: center; padding: 24px; box-sizing: border-box;
  }
  a {
    display: inline-block; margin-top: 16px; padding: 14px 22px; border-radius: 12px;
    background: var(--accent); color: var(--ground); font-weight: 800; text-decoration: none;
  }
  a:focus-visible { outline: 3px solid var(--ink); outline-offset: 3px; }
</style>
</head>
<body>
<main>
  <p>Google Play로 이동합니다…</p>
  <a id="go" href="https://play.google.com/store/apps/details?id=com.xaxavoo.rebalancing&amp;hl=ko">Google Play에서 받기</a>
</main>
<script>
  (function () {
    var q = new URLSearchParams(location.search);
    var clean = function (s) { return (s || '').replace(/[^a-z0-9_-]/gi, '').slice(0, 40); };
    var src = clean(q.get('src')) || 'web';
    var c = clean(q.get('c')) || 'link';
    var url = 'https://play.google.com/store/apps/details?id=com.xaxavoo.rebalancing&hl=ko'
      + '&utm_source=' + src + '&utm_campaign=' + c;
    document.getElementById('go').href = url;
    location.replace(url);
  })();
</script>
</body>
</html>
