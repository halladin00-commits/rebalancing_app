name: Update Stock Data

on:
  schedule:
    - cron: '0 2 * * 1'  # 매주 월요일 오전 11시 KST (UTC 02:00)
  workflow_dispatch:       # Actions 탭에서 수동 실행 가능

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install pykrx

      - name: Generate stock data
        run: python generate_stocks.py

      - name: Commit and push if changed
        run: |
          git config user.email "action@github.com"
          git config user.name "GitHub Action"
          git add stocks.json meta.json
          git diff --staged --quiet || git commit -m "chore: auto-update stock data $(date +%Y-%m-%d)"
          git push
